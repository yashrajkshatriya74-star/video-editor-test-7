# This file was missing from the original scaffold — that's exactly what
# caused the "android.useAndroidX property is not enabled" build failure.

# Required: every androidx.* dependency in this project needs this.
android.useAndroidX=true

# Recommended alongside useAndroidX for any project still on old support
# libraries (none here, but harmless/standard to set).
android.enableJetifier=false

# Standard performance/behavior settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
kotlin.code.style=official
